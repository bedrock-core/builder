name: Publish Bedrock types

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version pinned in packages/bedrock-types/releases.json
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency: publish-bedrock-types

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPES_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/cache@v6
        with:
          path: |
            packages/bedrock-types/.bedrock-core/cache/schema-types/*.zip
            packages/bedrock-types/.bedrock-core/cache/schema-types/*.tgz
          key: bedrock-types-inputs-${{ hashFiles('packages/bedrock-types/releases.json') }}
          restore-keys: bedrock-types-inputs-
      - name: Audit, verify and publish the selected declarations
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packages/bedrock-types/src/pack.ts "$TYPES_VERSION" --publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bedrock-types-release
          include-hidden-files: true
          path: |
            packages/bedrock-types/.bedrock-core/releases/*/vanilla.json
            packages/bedrock-types/.bedrock-core/releases/*/*.tgz
          if-no-files-found: ignore
