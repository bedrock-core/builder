name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn acceptance
      - run: yarn pack-release
      - run: yarn test:packages
      - name: Verify release preparation leaves source clean
        run: node -e "const {execFileSync}=require('node:child_process'); const changed=execFileSync('git',['status','--porcelain=v1'],{encoding:'utf8'}).trim(); if(changed){console.error(changed);process.exit(1)}"
