name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Packages to publish
        type: choice
        required: true
        default: builder
        options: [builder, cli]

concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - uses: changesets/action@v2
        with:
          version-script: yarn version:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - name: Configure CLI evidence paths
        if: inputs.scope == 'cli'
        run: |
          echo "BEDROCK_CLI_TARBALL=$RUNNER_TEMP/bedrock-core-cli.tgz" >> "$GITHUB_ENV"
          echo "BEDROCK_CLI_SMOKE_SUMMARY=$RUNNER_TEMP/cli-smoke-summary.json" >> "$GITHUB_ENV"
          echo "BC_BDS_HOME=$GITHUB_WORKSPACE/.bds" >> "$GITHUB_ENV"
      - uses: ./.github/actions/acceptance
        with:
          mode: ${{ inputs.scope == 'cli' && 'registry' || 'candidates' }}
      - name: Verify release archives
        run: yarn release
      - name: Pack CLI candidate
        if: inputs.scope == 'cli'
        run: yarn workspace @bedrock-core/cli pack --out "$BEDROCK_CLI_TARBALL"
      - name: Verify registry-only starters
        if: inputs.scope == 'cli'
        run: node scripts/smoke-cli.mjs "$BEDROCK_CLI_TARBALL" "$RUNNER_TEMP/cli-smoke"
      - uses: changesets/action@v2
        with:
          publish-script: yarn publish:ci
      - name: Keep Builder verification
        if: always() && inputs.scope == 'builder'
        uses: actions/upload-artifact@v7
        with:
          name: builder-release-verification
          path: |
            .bedrock-core/release/tarballs/verified*.json
            .bedrock-core/acceptance/candidate-*/archives/index.json
          if-no-files-found: ignore
      - name: Keep CLI smoke evidence
        if: always() && inputs.scope == 'cli'
        uses: actions/upload-artifact@v7
        with:
          name: cli-release-candidate
          path: |
            ${{ env.BEDROCK_CLI_TARBALL }}
            ${{ env.BEDROCK_CLI_SMOKE_SUMMARY }}
            ${{ runner.temp }}/cli-smoke/bedrock-cli-smoke-*/summary.json
          if-no-files-found: warn
